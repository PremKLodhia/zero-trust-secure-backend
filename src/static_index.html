<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zero-Trust Evidence Exchange - Passkey Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0b0f19; color: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { background-color: #111827; border: 1px solid #1f2937; border-radius: 16px; width: 100%; max-width: 650px; padding: 32px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
    .header { display: flex; align-items: center; gap: 16px; border-bottom: 1px solid #1f2937; padding-bottom: 20px; margin-bottom: 24px; }
    .icon-box { width: 44px; height: 44px; border-radius: 10px; background: rgba(16, 185, 129, 0.15); display: flex; align-items: center; justify-content: center; font-size: 22px; }
    .title { font-size: 20px; font-weight: 700; color: #ffffff; }
    .subtitle { font-size: 13px; color: #9ca3af; }
    .field-group { margin-bottom: 20px; }
    .label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: #9ca3af; margin-bottom: 8px; }
    .input-row { display: flex; gap: 12px; }
    input { flex: 1; background-color: #1f2937; border: 1px solid #374151; border-radius: 8px; padding: 10px 14px; color: #ffffff; font-size: 14px; outline: none; }
    input:focus { border-color: #10b981; }
    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
    button { cursor: pointer; border: none; border-radius: 8px; padding: 14px; font-size: 14px; font-weight: 600; color: #ffffff; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.15s ease-in-out; }
    .btn-register { background-color: #059669; }
    .btn-register:hover { background-color: #10b981; }
    .btn-login { background-color: #2563eb; }
    .btn-login:hover { background-color: #3b82f6; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .console-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .badge { font-size: 11px; padding: 2px 8px; border-radius: 4px; background-color: #1f2937; color: #9ca3af; }
    .badge.success { background-color: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #059669; }
    .badge.error { background-color: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #dc2626; }
    .badge.running { background-color: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid #2563eb; }
    pre { background-color: #030712; border: 1px solid #1f2937; border-radius: 8px; padding: 14px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; color: #34d399; max-height: 220px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
    .footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #1f2937; padding-top: 16px; margin-top: 20px; font-size: 12px; color: #6b7280; }
    .footer a { color: #34d399; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="icon-box">🛡️</div>
      <div>
        <div class="title">Zero-Trust Evidence Exchange</div>
        <div class="subtitle">FIDO2 / WebAuthn Hardware-Bound Passkey Ceremony</div>
      </div>
    </div>

    <div class="field-group">
      <label class="label">Analyst Identity</label>
      <div class="input-row">
        <input id="username" type="text" value="analyst_demo" placeholder="Username">
        <input id="email" type="email" value="demo@example.com" placeholder="Email">
      </div>
    </div>

    <div class="btn-row">
      <button id="btn-register" class="btn-register" type="button">
        <span>🔑</span>
        <span>Register Passkey</span>
      </button>
      <button id="btn-login" class="btn-login" type="button">
        <span>🔐</span>
        <span>Login with Passkey</span>
      </button>
    </div>

    <div class="field-group">
      <div class="console-header">
        <span class="label" style="margin-bottom:0;">Ceremony Output & Token Store</span>
        <span id="status-badge" class="badge">Ready</span>
      </div>
      <pre id="log-console">System ready. Click 'Register Passkey' to prompt Windows Hello / Touch ID / YubiKey.</pre>
    </div>

    <div class="footer">
      <span>Protected by OPA Fail-Secure & Vault Transit</span>
      <a href="/docs" target="_blank">Open Swagger API Docs &rarr;</a>
    </div>
  </div>

  <script>
    const logConsole = document.getElementById('log-console');
    const statusBadge = document.getElementById('status-badge');

    function log(msg, type) {
      const ts = new Date().toLocaleTimeString();
      logConsole.textContent = "[" + ts + "] " + msg + "\n\n" + logConsole.textContent;
      if (type === 'success') {
        statusBadge.className = 'badge success';
        statusBadge.textContent = 'Success';
      } else if (type === 'error') {
        statusBadge.className = 'badge error';
        statusBadge.textContent = 'Error';
      } else {
        statusBadge.className = 'badge running';
        statusBadge.textContent = 'Processing';
      }
    }

    function base64urlToUint8Array(base64url) {
      const padding = '='.repeat((4 - (base64url.length % 4)) % 4);
      const base64 = (base64url + padding).replace(/\-/g, '+').replace(/_/g, '/');
      const rawData = window.atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
      }
      return outputArray;
    }

    function bufferToBase64url(buffer) {
      const bytes = new Uint8Array(buffer);
      let binary = '';
      for (let i = 0; i < bytes.byteLength; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return window.btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
    }

    async function ensureUser() {
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();

      const res = await fetch('/users', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Actor-ID': 'admin_root', 'X-Actor-Role': 'admin' },
        body: JSON.stringify({ username: username, email: email, role: 'analyst' })
      });
      if (res.status === 201) {
        const u = await res.json();
        return u.id;
      }
      const listRes = await fetch('/users');
      const users = await listRes.json();
      const match = users.find(function(u) { return u.username === username; });
      if (match) return match.id;
      throw new Error('Could not create or find user ' + username);
    }

    document.getElementById('btn-register').onclick = async function() {
      try {
        if (!window.PublicKeyCredential) {
          throw new Error('WebAuthn is not supported by your browser.');
        }

        log('Step 1: Resolving user identity...');
        const userId = await ensureUser();

        log('Step 2: Fetching registration challenge from backend...');
        const optRes = await fetch('/auth/webauthn/register/options', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: userId })
        });
        if (!optRes.ok) throw new Error('Failed to get registration options');
        const optData = await optRes.json();
        const options = JSON.parse(optData.options);

        log('Step 3: Triggering browser authenticator prompt (Windows Hello / Touch ID / YubiKey)...');
        const publicKey = {
          challenge: base64urlToUint8Array(options.challenge),
          rp: options.rp,
          user: {
            id: base64urlToUint8Array(options.user.id),
            name: options.user.name,
            displayName: options.user.displayName
          },
          pubKeyCredParams: options.pubKeyCredParams,
          timeout: options.timeout || 60000,
          authenticatorSelection: options.authenticatorSelection || {}
        };

        const credential = await navigator.credentials.create({ publicKey: publicKey });
        if (!credential) throw new Error('Authenticator prompt was cancelled');

        log('Step 4: Submitting attestation response to backend for cryptographic verification...');
        const credentialJSON = {
          id: credential.id,
          rawId: bufferToBase64url(credential.rawId),
          type: credential.type,
          response: {
            clientDataJSON: bufferToBase64url(credential.response.clientDataJSON),
            attestationObject: bufferToBase64url(credential.response.attestationObject)
          }
        };

        const verifyRes = await fetch('/auth/webauthn/register/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: userId, credential_json: JSON.stringify(credentialJSON) })
        });
        const verifyData = await verifyRes.json();

        if (verifyRes.ok) {
          log('✅ Passkey registered successfully! Public key stored in backend.\nYou can now click "Login with Passkey".', 'success');
        } else {
          log('❌ Verification failed: ' + JSON.stringify(verifyData), 'error');
        }
      } catch (err) {
        log('❌ Registration error: ' + err.message, 'error');
      }
    };

    document.getElementById('btn-login').onclick = async function() {
      const username = document.getElementById('username').value.trim();
      try {
        if (!window.PublicKeyCredential) {
          throw new Error('WebAuthn is not supported by your browser.');
        }

        log('Step 1: Requesting authentication challenge for ' + username + '...');
        const optRes = await fetch('/auth/webauthn/login/options', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username })
        });
        if (!optRes.ok) throw new Error('User has no registered passkey yet. Click "Register Passkey" first!');
        const optData = await optRes.json();
        const options = JSON.parse(optData.options);

        log('Step 2: Triggering biometric assertion (Windows Hello / Touch ID / YubiKey)...');
        const publicKey = {
          challenge: base64urlToUint8Array(options.challenge),
          rpId: options.rpId,
          timeout: options.timeout || 60000,
          allowCredentials: (options.allowCredentials || []).map(function(c) {
            return {
              type: c.type,
              id: base64urlToUint8Array(c.id)
            };
          })
        };

        const assertion = await navigator.credentials.get({ publicKey: publicKey });
        if (!assertion) throw new Error('Authenticator assertion was cancelled');

        log('Step 3: Submitting assertion signature to backend for verification...');
        const assertionJSON = {
          id: assertion.id,
          rawId: bufferToBase64url(assertion.rawId),
          type: assertion.type,
          response: {
            clientDataJSON: bufferToBase64url(assertion.response.clientDataJSON),
            authenticatorData: bufferToBase64url(assertion.response.authenticatorData),
            signature: bufferToBase64url(assertion.response.signature),
            userHandle: assertion.response.userHandle ? bufferToBase64url(assertion.response.userHandle) : null
          }
        };

        const verifyRes = await fetch('/auth/webauthn/login/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username, credential_json: JSON.stringify(assertionJSON) })
        });
        const tokenData = await verifyRes.json();

        if (verifyRes.ok) {
          log('🎉 WebAuthn Login Successful!\n\n[Access Token - 15m Short-Lived JWT]:\n' + tokenData.access_token + '\n\n[Rotating Refresh Token]:\n' + tokenData.refresh_token, 'success');
        } else {
          log('❌ Login verification failed: ' + JSON.stringify(tokenData), 'error');
        }
      } catch (err) {
        log('❌ Authentication error: ' + err.message, 'error');
      }
    };
  </script>
</body>
</html>
