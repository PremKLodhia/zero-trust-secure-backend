[project]
name = "zt-backend"
version = "0.1.0"
description = "Zero-Trust Secure Backend and Identity Threat Detection for Case-File and Evidence Exchange"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.1",
    "webauthn>=2.1.0",
    "authlib>=1.3.0",
    "pyjwt>=2.8.0",
    "cryptography>=42.0.5",
    "httpx>=0.27.0",
    "hvac>=2.1.0",
    "scikit-learn>=1.4.1",
    "numpy>=1.26.4",
    "pandas>=2.2.1",
    "email-validator>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=4.1.0",
    "playwright>=1.42.0",
    "semgrep>=1.65.0",
    "black>=24.2.0",
    "flake8>=7.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
