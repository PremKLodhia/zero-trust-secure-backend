name: Zero-Trust Backend CI & Continuous Adversarial Testing

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-sast:
    name: Unit & Fail-Secure Tests + Semgrep SAST
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zt_user
          POSTGRES_PASSWORD: zt_password
          POSTGRES_DB: zt_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Start OPA and Vault Containers
        run: |
          docker run -d --name opa -p 8181:8181 -v ${{ github.workspace }}/policies:/policies openpolicyagent/opa:latest run --server --addr=0.0.0.0:8181 /policies
          docker run -d --name vault -p 8200:8200 -e VAULT_DEV_ROOT_TOKEN_ID=root -e VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200 hashicorp/vault:1.15
          sleep 5
          curl -f http://localhost:8181/v1/data || echo "OPA started"
          curl -f http://localhost:8200/v1/sys/health || echo "Vault started"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install semgrep

      - name: Run Test Suite with Fail-Secure & Crypto Verification
        env:
          DATABASE_URL: postgresql+psycopg2://zt_user:zt_password@localhost:5432/zt_db
          OPA_URL: http://localhost:8181/v1/data/case_access/allow
          VAULT_ADDR: http://localhost:8200
          VAULT_TOKEN: root
        run: |
          pytest -v tests/

      - name: Verify Deliberate Vulnerability Remediation Harness
        run: |
          python scripts/vuln_demo/verify_fix.py

      - name: Run Semgrep SAST on Application Source
        run: |
          semgrep scan --config auto --config p/owasp-top-ten --exclude scripts/vuln_demo/vulnerable_verifier.py src/

  dast-scan:
    name: OWASP ZAP Baseline DAST
    runs-on: ubuntu-latest
    needs: test-and-sast
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and Launch Application Stack
        run: |
          docker compose up -d --build
          sleep 12
          curl -f http://localhost:8000/health || exit 1

      - name: Run OWASP ZAP Baseline Scan in Docker
        run: |
          mkdir -p zap-reports
          docker run --user root --network host -v $(pwd)/zap-reports:/zap/wrk:rw -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t http://localhost:8000 -r zap_report.html -I || true

      - name: Upload ZAP DAST Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-dast-report
          path: zap-reports/zap_report.html
