name: Zero-Trust Backend CI & Continuous Adversarial Testing

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-sast:
    name: Unit & Fail-Secure Tests + Semgrep SAST
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zt_user
          POSTGRES_PASSWORD: zt_password
          POSTGRES_DB: zt_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      opa:
        image: openpolicyagent/opa:latest
        ports:
          - 8181:8181
        volumes:
          - ./policies:/policies
        options: >-
          run --server --addr=0.0.0.0:8181 /policies

      vault:
        image: hashicorp/vault:1.15
        ports:
          - 8200:8200
        env:
          VAULT_DEV_ROOT_TOKEN_ID: root
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install semgrep

      - name: Run Test Suite with Fail-Secure & Crypto Verification
        env:
          DATABASE_URL: postgresql+psycopg2://zt_user:zt_password@localhost:5432/zt_db
          OPA_URL: http://localhost:8181/v1/data/case_access/allow
          VAULT_ADDR: http://localhost:8200
          VAULT_TOKEN: root
        run: |
          pytest -v --cov=src --cov-report=term-missing tests/

      - name: Run Semgrep SAST (Security & OWASP Top 10)
        run: |
          semgrep scan --config auto --config p/owasp-top-ten --error

      - name: Verify Deliberate Vulnerability Remediation Harness
        run: |
          python scripts/vuln_demo/verify_fix.py

  dast-scan:
    name: OWASP ZAP Baseline DAST
    runs-on: ubuntu-latest
    needs: test-and-sast
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and Launch Docker Compose Stack
        run: |
          docker compose up -d --build
          sleep 10
          curl -f http://localhost:8000/health || exit 1

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:8000"
          rules_file_name: '.zap/rules.tsv'
          fail_action: false
