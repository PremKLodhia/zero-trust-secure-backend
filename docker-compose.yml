version: '3.8'

services:
  app:
    build: .
    container_name: zt-backend-app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://zt_user:zt_password@postgres:5432/zt_db
      - OPA_URL=http://opa:8181/v1/data/case_access/allow
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=root
      - WEBAUTHN_RP_ID=localhost
      - WEBAUTHN_ORIGIN=http://localhost:8000
    depends_on:
      postgres:
        condition: service_healthy
      opa:
        condition: service_started
      vault:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: zt-backend-db
    environment:
      POSTGRES_USER: zt_user
      POSTGRES_PASSWORD: zt_password
      POSTGRES_DB: zt_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zt_user -d zt_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  opa:
    image: openpolicyagent/opa:latest
    container_name: zt-backend-opa
    ports:
      - "8181:8181"
    volumes:
      - ./policies:/policies
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "/policies"

  vault:
    image: hashicorp/vault:1.15
    container_name: zt-backend-vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK

volumes:
  postgres_data:
